# Serves the built SPA and reverse-proxies the API to the gateway, so the browser makes
# same-origin calls and CORS is a non-issue in the Compose network.

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets with a long cache; the SPA entrypoint is never cached.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API and health probes go to the gateway.
    location /api/ {
        proxy_pass http://api-gateway:8000;
        # Live provider searches have a 90-second end-to-end deadline.
        proxy_read_timeout 100s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /health/ {
        proxy_pass http://api-gateway:8000;
    }

    # SPA fallback: any other path serves index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
