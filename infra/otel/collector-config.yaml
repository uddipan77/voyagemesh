# OpenTelemetry Collector configuration. Receives OTLP from every VoyageMesh service, forwards
# traces to Jaeger for inspection, and exposes a Prometheus endpoint for any collector-side
# metrics. Wired into Docker Compose in Phase 16.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 5s
  # Defence in depth: strip any attribute that could carry a credential before export, so a
  # mis-set span attribute never reaches a backend.
  attributes/redact:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: authorization
        action: delete
      - key: api_key
        action: delete

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: normal

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes/redact, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
