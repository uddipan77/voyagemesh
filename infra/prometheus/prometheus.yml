# Prometheus scrape configuration for the local VoyageMesh stack. Wired into Docker Compose in
# Phase 16. Each service exposes /metrics (or /health/metrics for the gateway) in the Prometheus
# text format; metrics carry no secrets or payloads — only counters and histograms.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: voyagemesh

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8000"]
        labels: { component: gateway }

  - job_name: agents
    metrics_path: /metrics
    static_configs:
      - targets:
          - "transport-agent:8010"
          - "stay-agent:8020"
          - "itinerary-agent:8030"
        labels: { component: agent }

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
        labels: { component: collector }
